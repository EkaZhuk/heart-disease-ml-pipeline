[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-ml-pipeline"
version = "0.1.0"
description = "AutoML pipeline for heart disease prediction"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

# --- где искать пакеты (для setuptools) ---
[tool.setuptools.packages.find]
where = ["src"]

# --- Poetry: только управление зависимостями, без установки проекта ---
[tool.poetry]
package-mode = false

# --- Ruff ---
[tool.ruff]
line-length = 88
target-version = "py310"

exclude = [
    ".git", ".venv", "venv", "__pycache__",
    "models", "plots", "results", "build", "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print (ловит print!)
]
ignore = [
    "E501",  # line too long — ruff format сам разрулит
    "N803",  # X_train, X_test — ML-стиль, не ошибка
    "N806",  # X, X_train в функциях — ML-стиль
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# --- Mypy ---
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "matplotlib.*", "seaborn.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
